<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vanguard">
<meta name="theme-color" content="#0a0e16">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Vanguard</title>
<style>
  :root {
    --bg: #0a0e16;
    --accent: #4ad6e8;
    --accent-dim: #2a8a99;
    --danger: #ff5a4e;
    --warn: #ffb84a;
    --text: #e6f1f5;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    touch-action: none;
  }

  #game {
    position: fixed;
    inset: 0;
    display: block;
    touch-action: none;
  }

  /* HUD */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: calc(var(--safe-top) + 14px) 18px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  .health-wrap { width: 150px; }
  .health-label { font-size: 0.6rem; letter-spacing: 0.2em; opacity: 0.6; margin-bottom: 5px; }
  .health-bar {
    height: 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .health-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--danger), var(--warn), var(--accent));
    width: 100%;
    transition: width 0.15s ease;
  }
  .health-fill.low { animation: pulse 0.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .hud-right { text-align: right; }
  #score, #wave { font-size: 0.85rem; letter-spacing: 0.1em; line-height: 1.6; }
  #wave { opacity: 0.6; }

  #wave-banner {
    position: fixed;
    top: 32%;
    left: 0; right: 0;
    text-align: center;
    font-size: 1.6rem;
    letter-spacing: 0.4em;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 24px rgba(74,214,232,0.7);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }

  /* Joysticks */
  .joystick {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 26px);
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.14);
    touch-action: none;
    z-index: 20;
  }
  #joystick-move { left: 26px; }
  #joystick-aim { right: 26px; }
  .stick {
    position: absolute;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(74,214,232,0.3);
    border: 2px solid var(--accent);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Overlays */
  #title-screen, #gameover-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(10,14,22,0.94);
    text-align: center;
    padding: 24px;
    z-index: 50;
  }
  .hidden { display: none !important; }

  h1 {
    font-size: 2.6rem;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-shadow: 0 0 28px rgba(74,214,232,0.55);
    font-weight: 700;
  }
  .subtitle {
    opacity: 0.65;
    font-size: 0.85rem;
    max-width: 280px;
    line-height: 1.7;
    letter-spacing: 0.02em;
  }
  .result, .best {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 1rem;
    letter-spacing: 0.15em;
    opacity: 0.85;
  }
  .btn {
    background: var(--accent);
    color: #06151a;
    border: none;
    padding: 16px 48px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    margin-top: 8px;
    box-shadow: 0 8px 30px rgba(74,214,232,0.35);
  }

  /* Install banner */
  #install-banner {
    display: none;
    position: fixed;
    top: calc(var(--safe-top) + 64px);
    left: 16px; right: 16px;
    background: rgba(10,14,22,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    border-radius: 14px;
    padding: 12px 14px;
    z-index: 90;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  #install-banner p { font-size: 0.78rem; flex: 1; line-height: 1.4; }
  #install-banner p strong { display: block; margin-bottom: 2px; color: var(--accent); }
  #install-btn {
    background: var(--accent);
    color: #06151a;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.78rem;
    font-weight: 700;
    font-family: inherit;
  }
  #dismiss-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 1.2rem;
    padding: 4px;
    font-family: inherit;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="health-wrap">
    <div class="health-label">INTEGRITY</div>
    <div class="health-bar"><div class="health-fill" id="health-fill"></div></div>
  </div>
  <div class="hud-right">
    <div id="score">SCORE 0</div>
    <div id="wave">WAVE 0</div>
  </div>
</div>

<div id="wave-banner"></div>

<div id="install-banner">
  <p><strong>Install Vanguard</strong>Add to your home screen for fullscreen play, even offline.</p>
  <button id="install-btn">Install</button>
  <button id="dismiss-btn">✕</button>
</div>

<div class="joystick" id="joystick-move"><div class="stick"></div></div>
<div class="joystick" id="joystick-aim"><div class="stick"></div></div>

<div id="title-screen">
  <h1>VANGUARD</h1>
  <p class="subtitle">The swarm is inbound. Hold the line.<br><br>Left side: move &nbsp;·&nbsp; Right side: aim &amp; fire</p>
  <div class="best" id="title-best">BEST 0</div>
  <button class="btn" id="start-btn">DEPLOY</button>
</div>

<div id="gameover-screen" class="hidden">
  <h1>OVERRUN</h1>
  <div class="result" id="final-score">SCORE 0</div>
  <div class="best" id="high-score">BEST 0</div>
  <button class="btn" id="retry-btn">REDEPLOY</button>
</div>

<script>
// ── CANVAS SETUP ─────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (state.player) {
    state.player.x = clamp(state.player.x, state.player.r, W - state.player.r);
    state.player.y = clamp(state.player.y, state.player.r, H - state.player.r);
  }
}

// ── CONFIG ───────────────────────────────────────────────────────────
const PLAYER = {
  maxHp: 100,
  speed: 240,
  fireInterval: 0.11,
  bulletSpeed: 620,
  bulletDamage: 1,
  bulletRadius: 4,
  radius: 18
};

const ENEMY_TYPES = {
  drone: { r: 14, hp: 1, speed: 95, damage: 8,  score: 10, color: '#ff5a4e' },
  brute: { r: 26, hp: 4, speed: 55, damage: 18, score: 35, color: '#b54ae8' }
};

// ── STATE ────────────────────────────────────────────────────────────
const state = {
  running: false,
  player: { x: 0, y: 0, r: PLAYER.radius, hp: PLAYER.maxHp, maxHp: PLAYER.maxHp, aim: -Math.PI / 2, fireCooldown: 0, flash: 0 },
  bullets: [],
  enemies: [],
  particles: [],
  score: 0,
  wave: 0,
  spawnQueue: [],
  spawnTimer: 0,
  waveTransition: false,
  waveTimer: 0
};
let shake = 0;

// ── INPUT: VIRTUAL JOYSTICKS ────────────────────────────────────────
class Joystick {
  constructor(el, stickEl) {
    this.el = el;
    this.stick = stickEl;
    this.active = false;
    this.id = null;
    this.x = 0;
    this.y = 0;
    el.addEventListener('touchstart', e => this.start(e), { passive: false });
    el.addEventListener('touchmove', e => this.move(e), { passive: false });
    el.addEventListener('touchend', e => this.end(e), { passive: false });
    el.addEventListener('touchcancel', e => this.end(e), { passive: false });
  }
  start(e) {
    e.preventDefault();
    if (this.active) return;
    const t = e.changedTouches[0];
    this.id = t.identifier;
    this.active = true;
    this.update(t);
  }
  move(e) {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === this.id) this.update(t);
    }
  }
  update(t) {
    const rect = this.el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const max = rect.width / 2;
    const dist = Math.hypot(dx, dy);
    if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
    this.x = dx / max;
    this.y = dy / max;
    this.stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
  end(e) {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === this.id) {
        this.active = false;
        this.id = null;
        this.x = 0; this.y = 0;
        this.stick.style.transform = 'translate(-50%, -50%)';
      }
    }
  }
  get magnitude() { return Math.hypot(this.x, this.y); }
  get angle() { return Math.atan2(this.y, this.x); }
}

const moveJoy = new Joystick(document.getElementById('joystick-move'), document.querySelector('#joystick-move .stick'));
const aimJoy = new Joystick(document.getElementById('joystick-aim'), document.querySelector('#joystick-aim .stick'));

// ── INPUT: KEYBOARD / MOUSE FALLBACK (desktop testing) ─────────────
const keys = { left: false, right: false, up: false, down: false };
const KEY_MAP = {
  arrowleft: 'left', a: 'left',
  arrowright: 'right', d: 'right',
  arrowup: 'up', w: 'up',
  arrowdown: 'down', s: 'down'
};
window.addEventListener('keydown', e => {
  const k = KEY_MAP[e.key.toLowerCase()];
  if (k) keys[k] = true;
});
window.addEventListener('keyup', e => {
  const k = KEY_MAP[e.key.toLowerCase()];
  if (k) keys[k] = false;
});

const isTouchDevice = 'ontouchstart' in window;
const mouse = { x: 0, y: 0, down: false };
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => { mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseup', () => { mouse.down = false; });

document.body.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ── HELPERS ──────────────────────────────────────────────────────────
function spawnParticles(x, y, count, color, speed, life) {
  life = life || 0.5;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.4 + Math.random() * 0.6);
    state.particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: life * (0.6 + Math.random() * 0.6), maxLife: life,
      color, r: 2 + Math.random() * 2
    });
  }
}

function spawnEnemy(type) {
  const cfg = ENEMY_TYPES[type];
  const margin = 50;
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = -margin; y = Math.random() * H; }
  else if (side === 1) { x = W + margin; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = -margin; }
  else { x = Math.random() * W; y = H + margin; }
  state.enemies.push({
    type, x, y,
    r: cfg.r, hp: cfg.hp, maxHp: cfg.hp,
    speed: cfg.speed * (1 + (state.wave - 1) * 0.04),
    damage: cfg.damage,
    hitCooldown: 0, flash: 0
  });
}

function startWave(n) {
  state.wave = n;
  state.spawnQueue = [];
  const drones = 4 + n * 2;
  const brutes = Math.max(0, n - 2);
  for (let i = 0; i < drones; i++) state.spawnQueue.push('drone');
  for (let i = 0; i < brutes; i++) state.spawnQueue.push('brute');
  for (let i = state.spawnQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.spawnQueue[i], state.spawnQueue[j]] = [state.spawnQueue[j], state.spawnQueue[i]];
  }
  state.spawnTimer = 0;
  showWaveBanner(n);
}

function showWaveBanner(n) {
  const el = document.getElementById('wave-banner');
  el.textContent = 'WAVE ' + n;
  el.style.opacity = '1';
  clearTimeout(showWaveBanner._t);
  showWaveBanner._t = setTimeout(() => { el.style.opacity = '0'; }, 1300);
}

function fireBullet(p) {
  const mx = p.x + Math.cos(p.aim) * p.r * 1.3;
  const my = p.y + Math.sin(p.aim) * p.r * 1.3;
  state.bullets.push({
    x: mx, y: my,
    vx: Math.cos(p.aim) * PLAYER.bulletSpeed,
    vy: Math.sin(p.aim) * PLAYER.bulletSpeed,
    r: PLAYER.bulletRadius, dmg: PLAYER.bulletDamage, life: 1.2
  });
  spawnParticles(mx, my, 2, '#ffe9a8', 50, 0.08);
}

// ── UPDATE ───────────────────────────────────────────────────────────
function update(dt) {
  const p = state.player;

  // movement
  let mx = moveJoy.active ? moveJoy.x : 0;
  let my = moveJoy.active ? moveJoy.y : 0;
  if (keys.left) mx -= 1;
  if (keys.right) mx += 1;
  if (keys.up) my -= 1;
  if (keys.down) my += 1;
  const mlen = Math.hypot(mx, my);
  if (mlen > 1) { mx /= mlen; my /= mlen; }
  p.x += mx * PLAYER.speed * dt;
  p.y += my * PLAYER.speed * dt;
  p.x = clamp(p.x, p.r, W - p.r);
  p.y = clamp(p.y, p.r, H - p.r);

  // aim + fire
  let firing = false;
  if (aimJoy.active && aimJoy.magnitude > 0.25) {
    p.aim = aimJoy.angle;
    firing = true;
  } else if (!isTouchDevice) {
    p.aim = Math.atan2(mouse.y - p.y, mouse.x - p.x);
    firing = mouse.down;
  }
  p.fireCooldown -= dt;
  if (firing && p.fireCooldown <= 0) {
    fireBullet(p);
    p.fireCooldown = PLAYER.fireInterval;
  }
  if (p.flash > 0) p.flash -= dt;

  // bullets
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      state.bullets.splice(i, 1);
    }
  }

  // spawning
  if (state.spawnQueue.length > 0) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnEnemy(state.spawnQueue.shift());
      state.spawnTimer = Math.max(0.15, 0.45 - state.wave * 0.02);
    }
  }

  // enemies
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    e.x += dx / d * e.speed * dt;
    e.y += dy / d * e.speed * dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.hitCooldown > 0) e.hitCooldown -= dt;

    if (d < e.r + p.r && e.hitCooldown <= 0) {
      p.hp -= e.damage;
      p.flash = 0.15;
      e.hitCooldown = 0.6;
      shake = Math.min(shake + 6, 14);
      if (p.hp <= 0) { p.hp = 0; gameOver(); return; }
    }

    for (let j = state.bullets.length - 1; j >= 0; j--) {
      const b = state.bullets[j];
      const bd = Math.hypot(b.x - e.x, b.y - e.y);
      if (bd < e.r + b.r) {
        e.hp -= b.dmg;
        e.flash = 0.08;
        spawnParticles(b.x, b.y, 3, '#bff5ff', 80);
        state.bullets.splice(j, 1);
        if (e.hp <= 0) {
          state.score += ENEMY_TYPES[e.type].score;
          spawnParticles(e.x, e.y, 10, ENEMY_TYPES[e.type].color, 160);
          if (e.type === 'brute') shake = Math.min(shake + 8, 14);
          state.enemies.splice(i, 1);
        }
        break;
      }
    }
  }

  // particles
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const pt = state.particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.94; pt.vy *= 0.94;
    pt.life -= dt;
    if (pt.life <= 0) state.particles.splice(i, 1);
  }

  if (shake > 0) shake = Math.max(0, shake - dt * 40);

  // wave progression
  if (state.spawnQueue.length === 0 && state.enemies.length === 0 && !state.waveTransition) {
    state.waveTransition = true;
    state.waveTimer = 1.8;
  }
  if (state.waveTransition) {
    state.waveTimer -= dt;
    if (state.waveTimer <= 0) {
      state.waveTransition = false;
      startWave(state.wave + 1);
    }
  }

  updateHUD();
}

// ── RENDER ───────────────────────────────────────────────────────────
function drawPlayer(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.aim);
  ctx.beginPath();
  ctx.moveTo(p.r * 1.3, 0);
  ctx.lineTo(-p.r * 0.9, p.r * 0.85);
  ctx.lineTo(-p.r * 0.4, 0);
  ctx.lineTo(-p.r * 0.9, -p.r * 0.85);
  ctx.closePath();
  ctx.fillStyle = p.flash > 0 ? '#ffffff' : '#4ad6e8';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#bff5ff';
  ctx.stroke();
  ctx.restore();
}

function drawEnemy(e) {
  const cfg = ENEMY_TYPES[e.type];
  ctx.save();
  ctx.translate(e.x, e.y);
  const ang = Math.atan2(state.player.y - e.y, state.player.x - e.x);
  ctx.rotate(ang);
  ctx.beginPath();
  if (e.type === 'brute') {
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2;
      const px = Math.cos(a) * e.r, py = Math.sin(a) * e.r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
  } else {
    ctx.moveTo(e.r, 0);
    ctx.lineTo(-e.r * 0.7, e.r * 0.7);
    ctx.lineTo(-e.r * 0.7, -e.r * 0.7);
  }
  ctx.closePath();
  ctx.fillStyle = e.flash > 0 ? '#ffffff' : cfg.color;
  ctx.fill();
  ctx.restore();

  if (e.maxHp > 1) {
    const w = e.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w, 4);
    ctx.fillStyle = '#ff5a4e';
    ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w * (e.hp / e.maxHp), 4);
  }
}

function render() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  ctx.fillStyle = '#0a0e16';
  ctx.fillRect(-20, -20, W + 40, H + 40);

  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const grid = 50;
  for (let x = 0; x <= W; x += grid) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += grid) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  for (const pt of state.particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#ffe9a8';
  for (const b of state.bullets) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  }

  for (const e of state.enemies) drawEnemy(e);

  drawPlayer(state.player);

  ctx.restore();
}

function updateHUD() {
  const p = state.player;
  const pct = Math.max(0, p.hp / p.maxHp * 100);
  const fill = document.getElementById('health-fill');
  fill.style.width = pct + '%';
  fill.classList.toggle('low', pct <= 25);
  document.getElementById('score').textContent = 'SCORE ' + state.score;
  document.getElementById('wave').textContent = 'WAVE ' + state.wave;
}

// ── GAME FLOW ────────────────────────────────────────────────────────
function initGame() {
  const p = state.player;
  p.x = W / 2; p.y = H / 2;
  p.hp = PLAYER.maxHp; p.maxHp = PLAYER.maxHp;
  p.aim = -Math.PI / 2; p.fireCooldown = 0; p.flash = 0;
  state.bullets = []; state.enemies = []; state.particles = [];
  state.score = 0;
  state.waveTransition = false;
  shake = 0;
  startWave(1);
  state.running = true;
}

function gameOver() {
  state.running = false;
  const final = state.score;
  let best = Number(localStorage.getItem('vanguard-highscore') || 0);
  let isNew = false;
  if (final > best) { best = final; localStorage.setItem('vanguard-highscore', String(best)); isNew = true; }
  document.getElementById('final-score').textContent = 'SCORE ' + final;
  document.getElementById('high-score').textContent = (isNew ? 'NEW BEST ' : 'BEST ') + best;
  document.getElementById('gameover-screen').classList.remove('hidden');
}

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('title-screen').classList.add('hidden');
  initGame();
});
document.getElementById('retry-btn').addEventListener('click', () => {
  document.getElementById('gameover-screen').classList.add('hidden');
  initGame();
});

document.getElementById('title-best').textContent = 'BEST ' + Number(localStorage.getItem('vanguard-highscore') || 0);

// ── LOOP ─────────────────────────────────────────────────────────────
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (state.running) { update(dt); render(); }
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
state.player.x = W / 2;
state.player.y = H / 2;
render();
requestAnimationFrame(loop);

// ── INSTALL BANNER ───────────────────────────────────────────────────
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').style.display = 'flex';
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
  }
});
document.getElementById('dismiss-btn').addEventListener('click', () => {
  document.getElementById('install-banner').style.display = 'none';
});

// ── SERVICE WORKER ───────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
